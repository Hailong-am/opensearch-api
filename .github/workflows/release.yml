---
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      opensearch_version:
        description: "OpenSearch version to build against, for example 3.9.0"
        required: true
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.opensearch_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid OpenSearch version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Build plugin
        run: ./gradlew assemble -Dopensearch.version=${{ steps.version.outputs.version }} -Dbuild.snapshot=false

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "opensearch-api $VERSION" \
            --notes "OpenSearch API plugin built for OpenSearch $VERSION." \
            "build/distributions/opensearch-api-$VERSION.0.zip" \
            LICENSE.txt
